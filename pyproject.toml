[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overfit-radar"
version = "0.1.0"
description = "ML auditor for quantitative trading backtests on Indian markets"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Overfit Radar Research Team" }
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.4.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=3.3.0",
    "shap>=0.40.0",
    "pyyaml>=6.0",
    "pyarrow>=8.0.0",
    "yfinance>=0.2.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
markers = ["integration: requires the downloaded market cache"]

[tool.ruff]
line-length = 100
target-version = "py39"
select = ["E", "F", "W", "I"]
ignore = ["E501"]
